[package]
name = "sylph-desktop"
version = "0.1.0"
description = "Sylph — Adaptive Intelligent Desktop Entity & Navigator"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Phase 7: Screen Awareness
xcap = "0.1"
image = "0.25"
base64 = "0.22"
